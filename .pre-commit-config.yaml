exclude: |
  (?x)^(
    paper/IEEEtran\.cls|
    talk/beamerthemeComsys\.sty
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: chktex
        name: chktex (LaTeX linter)
        entry: chktex -q
        language: system
        types: [tex]

      - id: forbid-build-output
        name: forbid committing built PDFs
        entry: >-
          These PDFs are build output. CI publishes them to GitHub Pages and
          attaches them to tagged releases; committing them bloats history.
        language: fail
        files: ^(paper/seminar-paper\.pdf|talk/slides\.pdf)$
