name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic@sha256:f25ee2dcd00f58198f918064f4a1c8562410b33e84155bd55b02b419d73d9391

    steps:
      - uses: actions/checkout@v4

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint
        run: make lint

      - name: Build
        run: make

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            paper/seminar-paper.pdf
            talk/slides.pdf
          if-no-files-found: error

  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: site

      - name: Generate index page
        run: |
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Secure Multiparty Communication Systems</title>
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem;
                   margin: 4rem auto; padding: 0 1rem; }
            a { display: block; margin: .5rem 0; }
            footer { margin-top: 3rem; color: #666; font-size: .85rem; }
          </style>
          <h1>Secure Multiparty Communication Systems</h1>
          <a href="paper/seminar-paper.pdf">Seminar paper (PDF)</a>
          <a href="talk/slides.pdf">Talk slides (PDF)</a>
          <footer>
            Built from <code>${GITHUB_SHA}</code> on $(date -u +'%Y-%m-%d %H:%M UTC').
          </footer>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: site

      - name: Attach PDFs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            site/paper/seminar-paper.pdf \
            site/talk/slides.pdf
